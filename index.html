<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" />

        <link rel="stylesheet" href="./assets/css/style.css" />
        <title>Project</title>
    </head>

    <body>
        <div class="profile">
            <div class="profile__card">
                <div class="profile__content">
                    <img src="./assets/images/item.jpg" alt="" class="profile__img" />

                    <div class="profile__data">
                        <h3 class="profile__name">Artem</h3>
                        <p class="profile__profession">designer</p>

                        <div class="profile__status">
                            <span></span>
                            Available for work
                        </div>
                    </div>

                    <div class="profile__button" id="profile-btn">
                        <i class="ri-menu-line profile__menu"></i>
                        <i class="ri-close-large-line profile__close"></i>
                    </div>
                </div>

                <div class="profile__social" id="profile-social">
                    <a href="#" class="profile__link">
                        <span><i class="ri-github-line"></i></span>
                    </a>
                    <a href="#" class="profile__link">
                        <span><i class="ri-instagram-line"></i></span>
                    </a>
                    <a href="#" class="profile__link">
                        <span><i class="ri-dribbble-line"></i></span>
                    </a>
                    <a href="#" class="profile__link">
                        <span><i class="ri-youtube-line"></i></span>
                    </a>
                    <a href="#" class="profile__link">
                        <span><i class="ri-facebook-line"></i></span>
                    </a>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

        <script src="./assets/js/main.js"></script>
    </body>
</html>
